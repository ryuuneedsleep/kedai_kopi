<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pemesanan - Kopi Bintang ✰</title>
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">

            <div class="brand">
                <h1>✰ KOPI BINTANG ✰</h1>
                <p>Pesan minuman pilihanmu sekarang!</p>
            </div>

            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="pesan.html">Pemesanan</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="container">

        <section class="order-section">
            <h2>Formulir Pemesanan</h2>

            <p>Silakan isi formulir berikut untuk melakukan pemesanan.</p>

            <form class="order-form" action="pesan.html" method="get">

                <div class="form-group">
                    <label for="nama">Nama Pemesan:</label>
                    <input type="text" id="nama" name="nama" required>
                </div>

                <div class="form-group">
                    <label for="whatsapp">Nomor WhatsApp:</label>
                    <input type="tel" id="whatsapp" name="whatsapp" required>
                </div>

                <div class="form-group">
                    <label for="menu">Pilihan Menu:</label>

                    <select id="menu" name="menu" required>
                        <option value="">-- Pilih Menu --</option>
                        <option value="Espresso">Espresso - Rp18.000</option>
                        <option value="Cappuccino">Cappuccino - Rp25.000</option>
                        <option value="Caramel Macchiato">
                            Caramel Macchiato - Rp28.000
                        </option>
                        <option value="Matcha Latte">Matcha Latte - Rp25.000</option>
                        <option value="Chocolate Milk">
                            Chocolate Milk - Rp22.000
                        </option>
                        <option value="Thai Tea">Thai Tea - Rp20.000</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="jumlah">Jumlah Pesanan:</label>
                    <input type="number" id="jumlah" name="jumlah" min="1" max="10" value="1" required>
                </div>

                <fieldset class="form-group">
                    <legend>Cara Pengambilan:</legend>

                    <div class="radio-options">
                        <label class="radio-label" for="ambil">
                            <input type="radio" id="ambil" name="cara_ambil" value="Ambil di tempat" required>
                            Ambil di tempat
                        </label>

                        <label class="radio-label" for="antar">
                            <input type="radio" id="antar" name="cara_ambil" value="Diantar">
                            Diantar
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="catatan">Catatan Tambahan:</label>
                    <textarea id="catatan" name="catatan" rows="4"
                        placeholder="Tuliskan catatan pesananmu..."></textarea>
                </div>

                <button type="submit" class="submit-button">
                    Kirim Pesanan
                </button>

            </form>

        </section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <a href="https://share.google/eMm9Nw33iLPh6jzxK" target="_blank" rel="noopener noreferrer">
                Alamat: Jl. LPPU II No.15C, Tembalang,
                Kec. Tembalang, Kota Semarang, Jawa Tengah 50275
            </a>

            <p>&copy; 2026 Kopi Bintang ✰</p>
        </div>
    </footer>

</body>

</html>
